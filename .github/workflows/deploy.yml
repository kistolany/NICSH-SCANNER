name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to EC2 after a successful build
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone if first time, otherwise pull latest code
            if [ ! -d "NICSH-SCANNER" ]; then
              git clone https://github.com/kistolany/NICSH-SCANNER.git
            fi
            cd NICSH-SCANNER
            git pull origin main

            # Rebuild and restart containers
            docker build -t nicsh-scanner .
            docker stop nicsh-scanner || true
            docker rm nicsh-scanner || true
            docker run -d --name nicsh-scanner -p 8080:8080 nicsh-scanner
